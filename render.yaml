# Fish Farm GIS & Tracker Blueprint v2.4
# Phone formatter 09-6161-6335, Thai BE birthdate selector, cascading district dropdowns, fast saving
databases:
  - name: fish-farm-db
    databaseName: fishfarm
    user: fishfarm_user
    plan: free

services:
  - type: web
    name: fish-farm-gis
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: fish-farm-db
          property: connectionString
      - key: APP_VERSION
        value: "2.4.0"
