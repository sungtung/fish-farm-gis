# Fish Farm GIS & Tracker Blueprint v2.3
# Fixed psycopg / psycopg2 driver for PostgreSQL in SQLAlchemy 2.0
databases:
  - name: fish-farm-db
    databaseName: fishfarm
    user: fishfarm_user
    plan: free

services:
  - type: web
    name: fish-farm-gis
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: fish-farm-db
          property: connectionString
      - key: APP_VERSION
        value: "2.3.0"
